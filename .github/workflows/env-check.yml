name: Environment Variables Check

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [main, staging, develop]

jobs:
  check-env:
    name: Validate Environment Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check env.template is up to date
        run: |
          if [ ! -f "env.template" ]; then
            echo "❌ env.template is missing"
            exit 1
          fi
          echo "✅ env.template exists"
      
      - name: Check TypeScript types for env
        run: |
          if [ ! -f "src/config/env.ts" ]; then
            echo "❌ src/config/env.ts is missing"
            exit 1
          fi
          echo "✅ src/config/env.ts exists"
      
      - name: Validate TypeScript compilation
        run: npm run type-check
      
      - name: Check for hardcoded secrets
        run: |
          echo "Checking for hardcoded secrets..."
          
          # Check for Stripe keys
          if git grep -E "(sk_live_|pk_live_)" -- ':!*.md' ':!env.template' ':!config/*.example'; then
            echo "❌ Found hardcoded Stripe LIVE keys"
            exit 1
          fi
          
          # Check for Supabase service role keys (not in env files)
          if git grep -E "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+" -- ':!*.md' ':!env.template' ':!config/*.example' ':!.env*'; then
            echo "⚠️ Warning: Found JWT tokens in code"
          fi
          
          echo "✅ No hardcoded secrets found"
      
      - name: Summary
        run: |
          echo "## Environment Configuration Check ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ env.template exists" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ TypeScript types are valid" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ No hardcoded secrets detected" >> $GITHUB_STEP_SUMMARY
