# Configuration de protection des branches pour GitHub
# Utiliser avec l'app GitHub "Settings" ou configurer manuellement

repository:
  name: ava
  description: Plateforme de revente de billets éthique avec séquestre Stripe
  homepage: https://ava-tickets.com
  topics:
    - nextjs
    - typescript
    - stripe
    - tickets
    - marketplace
  private: false
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          - 'Lint & Format Check'
          - 'TypeScript Type Check'
          - 'Unit Tests'
          - 'Build Application'
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
        dismissal_restrictions: {}
      restrictions: null
      enforce_admins: true
      required_linear_history: false
      allow_force_pushes: false
      allow_deletions: false
      required_conversation_resolution: true
      lock_branch: false
      allow_fork_syncing: true

labels:
  # Type labels
  - name: 'bug'
    color: 'd73a4a'
    description: "Quelque chose ne fonctionne pas"
  - name: 'enhancement'
    color: 'a2eeef'
    description: "Nouvelle fonctionnalité ou demande"
  - name: 'documentation'
    color: '0075ca'
    description: "Amélioration de la documentation"
  - name: 'refactor'
    color: 'fbca04'
    description: "Refactoring du code"
  
  # Priority labels
  - name: 'priority: critical'
    color: 'b60205'
    description: "Nécessite une attention immédiate"
  - name: 'priority: high'
    color: 'd93f0b'
    description: "Priorité élevée"
  - name: 'priority: medium'
    color: 'fbca04'
    description: "Priorité moyenne"
  - name: 'priority: low'
    color: '0e8a16'
    description: "Priorité basse"
  
  # Status labels
  - name: 'status: needs-triage'
    color: 'ededed'
    description: "Nécessite un triage"
  - name: 'status: in-progress'
    color: 'yellow'
    description: "En cours de développement"
  - name: 'status: blocked'
    color: 'red'
    description: "Bloqué par quelque chose"
  - name: 'status: ready-for-review'
    color: '0e8a16'
    description: "Prêt pour review"
  
  # Area labels
  - name: 'area: auth'
    color: 'c5def5'
    description: "Authentification et KYC"
  - name: 'area: payments'
    color: 'c5def5'
    description: "Paiements et séquestre"
  - name: 'area: tickets'
    color: 'c5def5'
    description: "Gestion des billets"
  - name: 'area: ui'
    color: 'c5def5'
    description: "Interface utilisateur"
  - name: 'area: api'
    color: 'c5def5'
    description: "Backend API"
  - name: 'area: db'
    color: 'c5def5'
    description: "Base de données"
  
  # Special labels
  - name: 'security'
    color: 'b60205'
    description: "Problème de sécurité"
  - name: 'performance'
    color: 'fbca04'
    description: "Problème de performance"
  - name: 'good first issue'
    color: '7057ff'
    description: "Bon pour les nouveaux contributeurs"
  - name: 'help wanted'
    color: '008672'
    description: "Besoin d'aide externe"
